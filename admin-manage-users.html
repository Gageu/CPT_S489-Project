<!-- Manage Users Page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel=\"stylesheet\" href=\"css/styles.css\">
</head>

<body>
    <header class="bg-dark text-white text-center py-3">
        <h1>Admin: Manage Users</h1>
    </header>
    <main class="container my-5">
        <h2>Add New User</h2>
        <form>
            <div class="mb-3">
                <label for="new-username" class="form-label">Username</label>
                <input type="text" class="form-control" id="new-username" required>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role">
                    <option value="student">Student</option>
                    <option value="professor">Professor</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Add User</button>
        </form>

        <h2 class="mt-5">Manage Existing Users</h2>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>JohnDoe</td>
                    <td>johndoe@example.com</td>
                    <td>Student</td>
                    <td>Active</td>
                    <td>
                        <button class="btn btn-warning btn-sm">Ban</button>
                        <button class="btn btn-info btn-sm">Change Role</button>
                    </td>
                </tr>
                <tr>
                    <td>JaneSmith</td>
                    <td>janesmith@example.com</td>
                    <td>Professor</td>
                    <td>Banned</td>
                    <td>
                        <button class="btn btn-success btn-sm">Unban</button>
                        <button class="btn btn-info btn-sm">Change Role</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <footer class="text-center py-3 bg-light">
        <p>&copy; 2025 Study Group Organizer. All rights reserved.</p>
    </footer>
</body>

</html>
