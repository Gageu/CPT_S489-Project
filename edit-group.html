<!-- Edit Group Page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Group - Study Group Organizer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="bg-primary text-white text-center py-3">
        <h1>Edit Group</h1>
    </header>
    <main class="container my-5">
        <form>
            <div class="mb-3">
                <label for="group-name" class="form-label">Group Name</label>
                <input type="text" class="form-control" id="group-name" value="Study Buddies" required>
            </div>
            <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" class="form-control" id="subject" value="Data Structures" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description"
                    rows="3">Advanced data structures study group.</textarea>
            </div>
            <button type="submit" class="btn btn-success">Save Changes</button>
        </form>
    </main>
    <footer class="text-center py-3 bg-light">
        <p>&copy; 2025 Study Group Organizer. All rights reserved.</p>
    </footer>
</body>

</html>
