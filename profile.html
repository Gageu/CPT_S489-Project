<!-- Profile Page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Study Group Organizer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="bg-primary text-white text-center py-3">
        <h1>Profile</h1>
        <nav class="nav justify-content-center">
            <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
            <a class="nav-link text-white" href="create-group.html">Create Group</a>
            <a class="nav-link text-white" href="resource.html">Resources</a>
            <a class="nav-link text-white" href="notifications.html">Notifications</a>
            <a class="nav-link text-white" href="logout.html">Logout</a>
        </nav>
    </header>
    <main class="container my-5">
        <h2>User Settings</h2>
        <form>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" value="JohnDoe" readonly>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" value="johndoe@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </main>
    <footer class="text-center py-3 bg-light">
        <p>&copy; 2025 Study Group Organizer. All rights reserved.</p>
    </footer>
</body>

</html>
