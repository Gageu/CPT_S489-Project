<!-- Resource Page  -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources - Study Group Organizer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="bg-primary text-white text-center py-3">
        <h1>Resources</h1>
    </header>
    <main class="container my-5">
        <h2>Upload and Download Resources</h2>

        <div id="professor-section" class="mb-4">
            <h4>Upload File (Professors Only)</h4>
            <form>
                <div class="mb-3">
                    <label for="file-upload" class="form-label">Choose File</label>
                    <input type="file" class="form-control" id="file-upload">
                </div>
                <button type="submit" class="btn btn-success">Upload</button>
            </form>
        </div>

        <h4>Available Resources</h4>
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <a href="#">Resource 1.pdf</a>
                <button class="btn btn-primary btn-sm">Download</button>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <a href="#">Resource 2.docx</a>
                <button class="btn btn-primary btn-sm">Download</button>
            </li>
        </ul>
    </main>
    <footer class="text-center py-3 bg-light">
        <p>&copy; 2025 Study Group Organizer. All rights reserved.</p>
    </footer>
</body>

</html>
