<!-- Schedule Page  -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Study Group Organizer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        function toggleRSVP(button) {
            if (button.textContent === "RSVP") {
                button.textContent = "Attending";
                button.classList.remove("btn-outline-success");
                button.classList.add("btn-success");
            } else {
                button.textContent = "RSVP";
                button.classList.remove("btn-success");
                button.classList.add("btn-outline-success");
            }
        }
    </script>
</head>

<body>
    <header class="bg-primary text-white text-center py-3">
        <h1>Schedule Session</h1>
    </header>
    <main class="container my-5">
        <h3 class="mt-5">Upcoming Sessions</h3>
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Session 1 - Mar 1, 2025
                <button class="btn btn-outline-success btn-sm" onclick="toggleRSVP(this)">RSVP</button>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Session 2 - Mar 8, 2025
                <button class="btn btn-outline-success btn-sm" onclick="toggleRSVP(this)">RSVP</button>
            </li>
        </ul>
    </main>
    <footer class="text-center py-3 bg-light">
        <p>&copy; 2025 Study Group Organizer. All rights reserved.</p>
    </footer>
</body>

</html>
