<!-- Search Page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Study Groups - Study Group Organizer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="bg-primary text-white text-center py-3">
        <h1>Search Study Groups</h1>
    </header>
    <main class="container my-5">
        <form class="d-flex mb-4">
            <input class="form-control me-2" type="search" placeholder="Search by group name or subject"
                aria-label="Search">
            <select class="form-select me-2">
                <option value="all">All Groups</option>
                <option value="public">Public</option>
                <option value="private">Private</option>
            </select>
            <button class="btn btn-success" type="submit">Search</button>
        </form>

        <h4>Enter Access Code (for Private Groups)</h4>
        <input class="form-control mb-3" type="text" placeholder="Access Code">
        <button class="btn btn-primary mb-4">Join Group</button>

        <h3>Search Results</h3>
        <ul class="list-group">
            <li class="list-group-item">Data Structures Study Group</li>
            <li class="list-group-item">Algorithms Study Group</li>
        </ul>
    </main>
    <footer class="text-center py-3 bg-light">
        <p>&copy; 2025 Study Group Organizer. All rights reserved.</p>
    </footer>
</body>

</html>
